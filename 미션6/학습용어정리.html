<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 용어 정리</title>
    <style>
        /* 다크 모드와 라이트 모드를 위한 CSS 변수 설정 */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --container-bg: #fff;
            --border-color: #ddd;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --danger-color: #e74c3c;
            --danger-hover: #c0392b;
            --star-color: #f39c12;
            --input-bg: #fff;
            --input-text: #333;
        }

        body.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #f4f4f4;
            --container-bg: #2d2d2d;
            --border-color: #444;
            --primary-color: #3a7bc8;
            --primary-hover: #2c5e99;
            --input-bg: #333;
            --input-text: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
        }

        button {
            cursor: pointer;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: var(--primary-color);
            color: white;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.danger {
            background-color: var(--danger-color);
        }

        button.danger:hover {
            background-color: var(--danger-hover);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        input[type="text"], select, textarea {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 1rem;
        }

        .search-bar {
            flex-grow: 1;
            min-width: 200px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 6px 12px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 카드 보기 스타일 */
        .card-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .star {
            color: #ccc;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .star.active {
            color: var(--star-color);
        }

        .category-badge {
            font-size: 0.8rem;
            background-color: #eee;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        body.dark-mode .category-badge {
            background-color: #555;
            color: #eee;
        }

        .card-definition {
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .card-example {
            font-size: 0.9rem;
            color: #666;
            background-color: rgba(0,0,0,0.03);
            padding: 8px;
            border-left: 3px solid var(--primary-color);
            margin-bottom: 15px;
        }

        body.dark-mode .card-example {
            color: #aaa;
            background-color: rgba(255,255,255,0.05);
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 5px;
        }

        /* 표 보기 스타일 */
        .table-view {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--container-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        .table-view th, .table-view td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .table-view th {
            background-color: rgba(0,0,0,0.02);
            font-weight: bold;
        }

        body.dark-mode .table-view th {
            background-color: rgba(255,255,255,0.05);
        }

        .table-view tr:last-child td {
            border-bottom: none;
        }

        /* 모달(입력 폼) 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* 반응형 모바일 설정 */
        @media (max-width: 600px) {
            .table-view {
                display: block;
                overflow-x: auto;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>학습 용어 정리</h1>
            <button id="darkModeBtn">다크 모드 켜기</button>
        </header>

        <!-- 컨트롤 패널 (검색, 버튼들) -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="용어명 또는 뜻 검색...">
            <button id="viewToggleBtn">표 보기로 전환</button>
            <button id="addTermBtn">새 용어 추가</button>
            <button id="exportBtn">데이터 내보내기</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
            <button id="importBtn">데이터 가져오기</button>
        </div>

        <!-- 카테고리 탭 -->
        <div class="tabs" id="categoryTabs">
            <!-- 자바스크립트로 카테고리가 렌더링됩니다 -->
        </div>

        <!-- 용어 목록이 표시될 영역 -->
        <div id="termContainer">
            <!-- 자바스크립트로 카드 또는 표가 렌더링됩니다 -->
        </div>
    </div>

    <!-- 용어 추가 및 수정을 위한 모달 창 -->
    <div class="modal-overlay" id="termModal">
        <div class="modal">
            <h2 id="modalTitle">새 용어 추가</h2>
            <form id="termForm">
                <input type="hidden" id="termId">
                <div class="form-group">
                    <label for="termName">용어명 *</label>
                    <input type="text" id="termName" required>
                </div>
                <div class="form-group">
                    <label for="termCategory">카테고리 *</label>
                    <input type="text" id="termCategory" placeholder="예: 프로그래밍, 수학 등" required>
                </div>
                <div class="form-group">
                    <label for="termDefinition">뜻(설명) *</label>
                    <textarea id="termDefinition" required></textarea>
                </div>
                <div class="form-group">
                    <label for="termExample">예시 문장</label>
                    <textarea id="termExample" placeholder="선택 사항입니다"></textarea>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="termImportant">
                    <label for="termImportant" style="margin: 0;">중요(별표) 표시</label>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" style="background-color: #95a5a6;">취소</button>
                    <button type="submit">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. 초기 샘플 데이터
        const sampleData = [
            {
                id: "1",
                term: "HTML",
                definition: "웹 페이지의 구조를 만들기 위한 마크업 언어입니다.",
                category: "웹 개발",
                isImportant: true,
                example: "<h1>이것은 제목입니다</h1>"
            },
            {
                id: "2",
                term: "CSS",
                definition: "HTML 문서의 스타일(색상, 레이아웃 등)을 지정하는 언어입니다.",
                category: "웹 개발",
                isImportant: false,
                example: "body { background-color: white; }"
            },
            {
                id: "3",
                term: "알고리즘",
                definition: "어떤 문제를 해결하기 위한 명확한 절차나 방법입니다.",
                category: "컴퓨터 과학",
                isImportant: true,
                example: "정렬 알고리즘, 탐색 알고리즘 등"
            }
        ];

        // 2. 상태 관리 변수
        let terms = [];
        let viewMode = 'card'; // 'card' 또는 'table'
        let currentCategory = '전체';
        let searchQuery = '';

        // 3. DOM 요소 선택
        const termContainer = document.getElementById('termContainer');
        const categoryTabs = document.getElementById('categoryTabs');
        const searchInput = document.getElementById('searchInput');
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        const addTermBtn = document.getElementById('addTermBtn');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFile = document.getElementById('importFile');
        
        const termModal = document.getElementById('termModal');
        const termForm = document.getElementById('termForm');
        const cancelBtn = document.getElementById('cancelBtn');
        const modalTitle = document.getElementById('modalTitle');

        // 4. 초기화 함수
        function init() {
            loadFromLocalStorage();
            loadDarkModeState();
            renderCategories();
            renderTerms();
            setupEventListeners();
        }

        // 5. LocalStorage 데이터 관리
        function loadFromLocalStorage() {
            const stored = localStorage.getItem('learningTerms');
            if (stored) {
                terms = JSON.parse(stored);
            } else {
                terms = [...sampleData]; // 저장된 데이터가 없으면 샘플 데이터 사용
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('learningTerms', JSON.stringify(terms));
        }

        function loadDarkModeState() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                darkModeBtn.textContent = '라이트 모드 켜기';
            }
        }

        // 6. 화면 렌더링 함수들
        function renderCategories() {
            // 중복 없는 카테고리 목록 생성
            const categories = ['전체', ...new Set(terms.map(t => t.category))];
            
            // 현재 선택된 카테고리가 삭제되어 없다면 '전체'로 초기화
            if (!categories.includes(currentCategory)) {
                currentCategory = '전체';
            }

            categoryTabs.innerHTML = categories.map(cat => `
                <div class="tab ${cat === currentCategory ? 'active' : ''}" 
                     onclick="setCategory('${cat}')">
                    ${cat}
                </div>
            `).join('');
        }

        function setCategory(category) {
            currentCategory = category;
            renderCategories();
            renderTerms();
        }

        function renderTerms() {
            // 검색어와 카테고리에 맞게 데이터 필터링
            let filteredTerms = terms.filter(t => {
                const matchCategory = currentCategory === '전체' || t.category === currentCategory;
                const matchSearch = t.term.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    t.definition.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (viewMode === 'card') {
                renderCardView(filteredTerms);
            } else {
                renderTableView(filteredTerms);
            }
        }

        function renderCardView(filteredTerms) {
            if (filteredTerms.length === 0) {
                termContainer.innerHTML = '<p style="text-align:center; padding:20px;">조건에 맞는 용어가 없습니다.</p>';
                return;
            }

            termContainer.innerHTML = `<div class="card-view">
                ${filteredTerms.map(t => `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <span class="star ${t.isImportant ? 'active' : ''}" onclick="toggleImportant('${t.id}')">★</span>
                                ${escapeHTML(t.term)}
                            </div>
                            <span class="category-badge">${escapeHTML(t.category)}</span>
                        </div>
                        <div class="card-definition">${escapeHTML(t.definition)}</div>
                        ${t.example ? `<div class="card-example"><strong>예시:</strong> ${escapeHTML(t.example)}</div>` : ''}
                        <div class="card-actions">
                            <button onclick="editTerm('${t.id}')">수정</button>
                            <button class="danger" onclick="deleteTerm('${t.id}')">삭제</button>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderTableView(filteredTerms) {
            if (filteredTerms.length === 0) {
                termContainer.innerHTML = '<p style="text-align:center; padding:20px;">조건에 맞는 용어가 없습니다.</p>';
                return;
            }

            termContainer.innerHTML = `<table class="table-view">
                <thead>
                    <tr>
                        <th style="width: 50px; text-align:center;">중요</th>
                        <th style="width: 150px;">용어명</th>
                        <th style="width: 120px;">카테고리</th>
                        <th>뜻(설명)</th>
                        <th>예시</th>
                        <th style="width: 120px; text-align:center;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    ${filteredTerms.map(t => `
                        <tr>
                            <td style="text-align:center;">
                                <span class="star ${t.isImportant ? 'active' : ''}" onclick="toggleImportant('${t.id}')">★</span>
                            </td>
                            <td><strong>${escapeHTML(t.term)}</strong></td>
                            <td><span class="category-badge">${escapeHTML(t.category)}</span></td>
                            <td style="white-space: pre-wrap;">${escapeHTML(t.definition)}</td>
                            <td>${t.example ? escapeHTML(t.example) : '-'}</td>
                            <td style="text-align:center;">
                                <button onclick="editTerm('${t.id}')" style="padding: 4px 8px; font-size: 0.8rem;">수정</button>
                                <button class="danger" onclick="deleteTerm('${t.id}')" style="padding: 4px 8px; font-size: 0.8rem;">삭제</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>`;
        }

        // 7. 데이터 조작 함수 (CRUD)
        function toggleImportant(id) {
            const term = terms.find(t => t.id === id);
            if (term) {
                term.isImportant = !term.isImportant;
                saveToLocalStorage();
                renderTerms();
            }
        }

        function deleteTerm(id) {
            if (confirm('정말 이 용어를 삭제하시겠습니까?')) {
                terms = terms.filter(t => t.id !== id);
                saveToLocalStorage();
                renderCategories();
                renderTerms();
            }
        }

        function editTerm(id) {
            const term = terms.find(t => t.id === id);
            if (term) {
                document.getElementById('termId').value = term.id;
                document.getElementById('termName').value = term.term;
                document.getElementById('termCategory').value = term.category;
                document.getElementById('termDefinition').value = term.definition;
                document.getElementById('termExample').value = term.example || '';
                document.getElementById('termImportant').checked = term.isImportant;
                
                modalTitle.textContent = '용어 수정';
                termModal.style.display = 'flex';
            }
        }

        // 8. 이벤트 리스너 설정
        function setupEventListeners() {
            // 검색 기능
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderTerms();
            });

            // 보기 방식 전환
            viewToggleBtn.addEventListener('click', () => {
                viewMode = viewMode === 'card' ? 'table' : 'card';
                viewToggleBtn.textContent = viewMode === 'card' ? '표 보기로 전환' : '카드 보기로 전환';
                renderTerms();
            });

            // 다크 모드 토글
            darkModeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDark);
                darkModeBtn.textContent = isDark ? '라이트 모드 켜기' : '다크 모드 켜기';
            });

            // 모달 열기/닫기
            addTermBtn.addEventListener('click', () => {
                termForm.reset();
                document.getElementById('termId').value = '';
                modalTitle.textContent = '새 용어 추가';
                termModal.style.display = 'flex';
            });

            cancelBtn.addEventListener('click', () => {
                termModal.style.display = 'none';
            });

            // 폼 제출 (추가 및 수정)
            termForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const id = document.getElementById('termId').value;
                const newTerm = {
                    id: id || Date.now().toString(), // 새 항목은 현재 시간으로 고유 ID 생성
                    term: document.getElementById('termName').value.trim(),
                    category: document.getElementById('termCategory').value.trim(),
                    definition: document.getElementById('termDefinition').value.trim(),
                    example: document.getElementById('termExample').value.trim(),
                    isImportant: document.getElementById('termImportant').checked
                };

                if (id) {
                    // 기존 데이터 수정
                    const index = terms.findIndex(t => t.id === id);
                    if (index !== -1) terms[index] = newTerm;
                } else {
                    // 새 데이터 추가
                    terms.push(newTerm);
                }

                saveToLocalStorage();
                renderCategories();
                renderTerms();
                termModal.style.display = 'none';
            });

            // 데이터 내보내기 (JSON 파일 다운로드)
            exportBtn.addEventListener('click', () => {
                const dataStr = JSON.stringify(terms, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `학습용어백업_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // 데이터 가져오기
            importBtn.addEventListener('click', () => {
                importFile.click();
            });

            importFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (Array.isArray(importedData)) {
                            if (confirm('기존 데이터를 덮어쓰시겠습니까? (취소를 누르면 기존 데이터에 추가됩니다)')) {
                                terms = importedData;
                            } else {
                                // 기존 데이터에 추가할 때 ID 중복 방지
                                const newItems = importedData.map(item => ({
                                    ...item,
                                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5)
                                }));
                                terms = [...terms, ...newItems];
                            }
                            saveToLocalStorage();
                            renderCategories();
                            renderTerms();
                            alert('데이터를 성공적으로 가져왔습니다.');
                        } else {
                            alert('올바른 형식의 파일이 아닙니다.');
                        }
                    } catch (err) {
                        alert('파일을 읽는 중 오류가 발생했습니다.');
                    }
                };
                reader.readAsText(file);
                importFile.value = ''; // 파일 입력 초기화
            });
        }

        // XSS 방지를 위한 HTML 이스케이프 함수
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // 앱 시작
        init();
    </script>
</body>
</html>
