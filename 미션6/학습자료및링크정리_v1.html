<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 자료 및 링크 정리</title>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18212b; --muted:#5b6776; --line:#d5dbe3;
  --accent:#1f5fd1; --accent-ink:#ffffff; --tag:#e4ebf7; --danger:#b3261e; --shadow:0 1px 2px rgba(24,33,43,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3642;
  --accent:#6ea1ff; --accent-ink:#0b1220; --tag:#25324a; --danger:#ff8a80; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px clamp(14px,4vw,32px)}
.topbar h1{margin:0;font-size:1.25rem;letter-spacing:-.02em;margin-right:auto}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:34px;padding:4px 10px;font-size:.9rem}
.btn.danger{color:var(--danger)}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
.controls select{width:auto}

main{max-width:1100px;margin:0 auto;padding:22px clamp(14px,4vw,32px) 60px}
.count{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}

.icon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--tag);font-size:1.4rem;flex:none}
a.title,.title{font-weight:700;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
a.title{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.cat{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--tag);border-radius:6px;padding:0 8px;font-size:.85rem}
.desc{margin:0;color:var(--muted);overflow-wrap:anywhere}
.url{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.actions{display:flex;gap:6px}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card-head{display:flex;gap:12px;align-items:center}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.date{font-size:.85rem;color:var(--muted)}

/* 표 */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.9rem;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.t-title{display:flex;gap:10px;align-items:center}

/* 입력 폼 */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,14,20,.55)}
form{padding:20px;display:grid;gap:14px}
form h2{margin:0;font-size:1.15rem}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
label small{font-weight:400;color:var(--muted)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.err{color:var(--danger);font-size:.9rem;margin:0;min-height:0}

@media (max-width:560px){
  .topbar h1{width:100%}
  .controls{width:100%}
  .controls .primary{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <h1>학습 자료 및 링크 정리</h1>
  <div class="controls">
    <button class="btn" id="viewBtn" type="button"></button>
    <select id="sortSel" aria-label="정렬">
      <option value="recent">최근 추가순</option>
      <option value="name">이름순</option>
    </select>
    <button class="btn" id="themeBtn" type="button"></button>
    <button class="btn primary" id="addBtn" type="button">자료 추가</button>
  </div>
</header>

<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" novalidate>
    <h2 id="dlgTitle">자료 추가</h2>
    <label>제목
      <input type="text" id="fTitle" maxlength="100" required>
    </label>
    <label>URL(링크) <small>링크가 없는 자료는 비워 두세요.</small>
      <input type="text" id="fUrl" inputmode="url" placeholder="https://">
    </label>
    <label>카테고리
      <select id="fCat"></select>
    </label>
    <div>
      <div class="row">
        <input type="text" id="fNewCat" maxlength="20" placeholder="새 카테고리 이름" aria-label="새 카테고리 이름">
        <button type="button" class="btn" id="newCatBtn">카테고리 추가</button>
      </div>
    </div>
    <label>설명
      <textarea id="fDesc" maxlength="300"></textarea>
    </label>
    <label>태그 <small>쉼표(,)로 구분해서 입력하세요.</small>
      <input type="text" id="fTags" placeholder="예: 파이썬, 기초">
    </label>
    <label>아이콘(썸네일) <small>이모지나 글자 한 자를 입력하세요.</small>
      <input type="text" id="fIcon" maxlength="2" placeholder="📘">
    </label>
    <p class="err" id="err" role="alert"></p>
    <div class="form-actions">
      <button type="button" class="btn" id="cancelBtn">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var KEY_ITEMS='studyLinks.items.v1', KEY_CATS='studyLinks.cats.v1';
  var DEFAULT_CATS=['강의','문서','블로그','영상','기타'];
  var items=[], cats=[], view='card', sort='recent', editingId=null;

  function load(key){ try{ var v=localStorage.getItem(key); return v===null?null:JSON.parse(v); }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(KEY_ITEMS,JSON.stringify(items)); localStorage.setItem(KEY_CATS,JSON.stringify(cats)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function init(){
    var c=load(KEY_CATS), i=load(KEY_ITEMS);
    cats = Array.isArray(c)&&c.length ? c : DEFAULT_CATS.slice();
    if(Array.isArray(i)){ items=i; }
    else {
      var t=Date.now();
      items=[
        {id:uid(),title:'점프 투 파이썬',url:'https://wikidocs.net/book/1',category:'문서',desc:'파이썬 입문자를 위한 무료 온라인 책',tags:['파이썬','기초'],icon:'📘',createdAt:t-4000},
        {id:uid(),title:'MDN 웹 문서',url:'https://developer.mozilla.org/ko/',category:'문서',desc:'HTML, CSS, JavaScript 공식 참고 문서',tags:['웹','참고'],icon:'🌐',createdAt:t-3000},
        {id:uid(),title:'생활코딩',url:'https://opentutorials.org',category:'강의',desc:'프로그래밍 기초를 쉽게 설명하는 강의 모음',tags:['입문','코딩'],icon:'🎓',createdAt:t-2000},
        {id:uid(),title:'TED 강연',url:'https://www.ted.com',category:'영상',desc:'학습 동기와 아이디어를 얻는 짧은 강연',tags:['동기부여'],icon:'🎬',createdAt:t-1000},
        {id:uid(),title:'이번 주 공부 계획 메모',url:'',category:'기타',desc:'링크 없이 적어 두는 일반 자료 예시입니다.',tags:['계획'],icon:'📝',createdAt:t}
      ];
    }
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark?'dark':'light');
    save();
    render();
  }

  var $=function(id){return document.getElementById(id);};
  function h(tag,cls,text){ var e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e; }

  function setTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    $('themeBtn').textContent = t==='dark' ? '밝은 모드' : '다크 모드';
  }

  function sorted(){
    var a=items.slice();
    if(sort==='name') a.sort(function(x,y){return x.title.localeCompare(y.title,'ko');});
    else a.sort(function(x,y){return y.createdAt-x.createdAt;});
    return a;
  }
  function fmtDate(ts){ var d=new Date(ts); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }

  function titleNode(it){
    if(it.url){ var a=h('a','title',it.title); a.href=it.url; a.target='_blank'; a.rel='noopener noreferrer'; return a; }
    return h('span','title',it.title);
  }
  function tagsNode(it){
    var w=h('div','tags'); (it.tags||[]).forEach(function(t){ w.appendChild(h('span','tag',t)); }); return w;
  }
  function actionsNode(it){
    var w=h('div','actions');
    var e=h('button','btn small','수정'); e.type='button'; e.onclick=function(){openForm(it.id);};
    var d=h('button','btn small danger','삭제'); d.type='button'; d.onclick=function(){ removeItem(it.id); };
    w.appendChild(e); w.appendChild(d); return w;
  }

  function render(){
    var list=$('list'); list.textContent='';
    $('viewBtn').textContent = view==='card' ? '표로 보기' : '카드로 보기';
    $('count').textContent = '저장된 자료 '+items.length+'개';
    if(!items.length){
      list.appendChild(h('div','empty','저장된 자료가 없습니다. 위의 “자료 추가” 버튼으로 첫 자료를 추가해 보세요.'));
      return;
    }
    var data=sorted();
    if(view==='card'){
      var g=h('div','cards');
      data.forEach(function(it){
        var c=h('article','card');
        var head=h('div','card-head');
        head.appendChild(h('span','icon',it.icon||'📄'));
        var box=h('div'); box.appendChild(titleNode(it)); head.appendChild(box);
        c.appendChild(head);
        c.appendChild(h('div')).appendChild(h('span','cat',it.category));
        if(it.desc) c.appendChild(h('p','desc',it.desc));
        if(it.url) c.appendChild(h('div','url',it.url));
        if(it.tags&&it.tags.length) c.appendChild(tagsNode(it));
        var f=h('div','card-foot'); f.appendChild(h('span','date',fmtDate(it.createdAt))); f.appendChild(actionsNode(it));
        c.appendChild(f); g.appendChild(c);
      });
      list.appendChild(g);
    } else {
      var wrap=h('div','table-wrap'), tb=h('table'), thead=h('thead'), tr=h('tr');
      ['제목','카테고리','설명','태그','추가일','관리'].forEach(function(n){ tr.appendChild(h('th',null,n)); });
      thead.appendChild(tr); tb.appendChild(thead);
      var body=h('tbody');
      data.forEach(function(it){
        var r=h('tr');
        var t1=h('td'), tt=h('div','t-title'); tt.appendChild(h('span','icon',it.icon||'📄'));
        var bx=h('div'); bx.appendChild(titleNode(it)); if(it.url) bx.appendChild(h('div','url',it.url));
        tt.appendChild(bx); t1.appendChild(tt); r.appendChild(t1);
        var t2=h('td'); t2.appendChild(h('span','cat',it.category)); r.appendChild(t2);
        r.appendChild(h('td','desc',it.desc||''));
        var t4=h('td'); t4.appendChild(tagsNode(it)); r.appendChild(t4);
        r.appendChild(h('td','date',fmtDate(it.createdAt)));
        var t6=h('td'); t6.appendChild(actionsNode(it)); r.appendChild(t6);
        body.appendChild(r);
      });
      tb.appendChild(body); wrap.appendChild(tb); list.appendChild(wrap);
    }
  }

  function fillCats(selected){
    var s=$('fCat'); s.textContent='';
    cats.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; s.appendChild(o); });
    if(selected && cats.indexOf(selected)>-1) s.value=selected;
  }

  function openForm(id){
    editingId=id||null;
    var it=id?items.filter(function(x){return x.id===id;})[0]:null;
    $('dlgTitle').textContent = it?'자료 수정':'자료 추가';
    $('fTitle').value = it?it.title:'';
    $('fUrl').value = it?it.url:'';
    fillCats(it?it.category:cats[0]);
    $('fDesc').value = it?it.desc:'';
    $('fTags').value = it?(it.tags||[]).join(', '):'';
    $('fIcon').value = it?(it.icon||''):'';
    $('fNewCat').value=''; $('err').textContent='';
    $('dlg').showModal();
    $('fTitle').focus();
  }

  function normUrl(v){
    v=v.trim(); if(!v) return '';
    if(!/^[a-z][a-z0-9+.-]*:/i.test(v)) v='https://'+v;
    try{ var u=new URL(v); return /^https?:$/.test(u.protocol)?v:null; }catch(e){ return null; }
  }

  function removeItem(id){
    var it=items.filter(function(x){return x.id===id;})[0]; if(!it) return;
    if(confirm('“'+it.title+'” 자료를 삭제할까요?')){
      items=items.filter(function(x){return x.id!==id;}); save(); render();
    }
  }

  $('addBtn').onclick=function(){openForm(null);};
  $('cancelBtn').onclick=function(){$('dlg').close();};
  $('viewBtn').onclick=function(){ view = view==='card'?'table':'card'; render(); };
  $('sortSel').onchange=function(e){ sort=e.target.value; render(); };
  $('themeBtn').onclick=function(){
    setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  };

  function addCategory(){
    var n=$('fNewCat').value.trim(); if(!n) return;
    var found=cats.filter(function(c){return c.toLowerCase()===n.toLowerCase();})[0];
    if(!found){ cats.push(n); found=n; save(); }
    fillCats(found); $('fNewCat').value='';
  }
  $('newCatBtn').onclick=addCategory;
  $('fNewCat').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addCategory(); } });

  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('fTitle').value.trim();
    if(!title){ $('err').textContent='제목을 입력해 주세요.'; $('fTitle').focus(); return; }
    var url=normUrl($('fUrl').value);
    if(url===null){ $('err').textContent='URL은 http:// 또는 https://로 시작하는 올바른 주소여야 합니다.'; $('fUrl').focus(); return; }
    var tags=$('fTags').value.split(',').map(function(t){return t.trim();}).filter(Boolean);
    var data={title:title,url:url,category:$('fCat').value||cats[0],desc:$('fDesc').value.trim(),tags:tags,icon:$('fIcon').value.trim()};
    if(editingId){
      items=items.map(function(x){ return x.id===editingId ? Object.assign({},x,data) : x; });
    } else {
      data.id=uid(); data.createdAt=Date.now(); items.push(data);
    }
    save(); render(); $('dlg').close();
  });

  init();
})();
</script>
</body>
</html>
