<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 티어리스트</title>
    <style>
        /* 기본 스타일 및 반응형 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* 헤더 및 컨트롤 영역 */
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="text"] {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            outline: none;
            width: 250px;
            max-width: 100%;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-add {
            background-color: #4CAF50;
            color: white;
        }
        .btn-add:hover { background-color: #45a049; }
        .btn-reset {
            background-color: #f44336;
            color: white;
        }
        .btn-reset:hover { background-color: #da190b; }

        /* 티어보드 영역 */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .tier-row {
            display: flex;
            min-height: 100px;
            border-bottom: 2px solid #333;
            background-color: #2a2a2a;
        }
        .tier-row:last-child {
            border-bottom: none;
        }
        
        /* 등급 글자(라벨) */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            flex-shrink: 0;
            text-align: center;
            transition: opacity 0.2s;
        }
        .tier-label:hover {
            opacity: 0.8;
        }
        .label-s { background-color: #ff7f7f; }
        .label-a { background-color: #ffbf7f; }
        .label-b { background-color: #ffff7f; }
        .label-c { background-color: #7fff7f; }
        .label-unranked { background-color: #aaaaaa; color: white; }

        /* 영화 카드가 놓이는 공간 */
        .tier-list {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 10px;
            min-height: 100px;
        }

        /* 영화 카드 */
        .movie-card {
            background-color: #444;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: keep-all;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.2s;
        }
        .movie-card:active {
            cursor: grabbing;
        }
        .movie-card.dragging {
            opacity: 0.5;
        }
        /* 클릭하여 선택된 상태 */
        .movie-card.selected {
            border-color: #2196F3;
            transform: scale(1.05);
            background-color: #555;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.8);
        }

        /* 미분류 영역 */
        .unranked-container {
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* 모바일 대응 (화면 폭이 좁아질 때) */
        @media (max-width: 600px) {
            .tier-label {
                width: 70px;
                font-size: 1.2rem;
            }
            .movie-card {
                font-size: 0.9rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 내 영화 티어리스트</h1>
        <div class="controls">
            <input type="text" id="movie-input" placeholder="영화 제목을 입력하세요" onkeypress="handleKeyPress(event)">
            <button class="btn-add" onclick="addMovie()">추가</button>
            <button class="btn-reset" onclick="resetTierList()">처음으로</button>
        </div>
    </header>

    <main>
        <!-- S, A, B, C 티어 보드 -->
        <div class="tier-board">
            <div class="tier-row">
                <div class="tier-label label-s" onclick="moveToTier('S')" title="클릭하여 선택한 영화를 S등급으로 이동">S</div>
                <div class="tier-list" id="tier-S" ondrop="drop(event, 'S')" ondragover="allowDrop(event)"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label label-a" onclick="moveToTier('A')" title="클릭하여 선택한 영화를 A등급으로 이동">A</div>
                <div class="tier-list" id="tier-A" ondrop="drop(event, 'A')" ondragover="allowDrop(event)"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label label-b" onclick="moveToTier('B')" title="클릭하여 선택한 영화를 B등급으로 이동">B</div>
                <div class="tier-list" id="tier-B" ondrop="drop(event, 'B')" ondragover="allowDrop(event)"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label label-c" onclick="moveToTier('C')" title="클릭하여 선택한 영화를 C등급으로 이동">C</div>
                <div class="tier-list" id="tier-C" ondrop="drop(event, 'C')" ondragover="allowDrop(event)"></div>
            </div>
        </div>

        <!-- 미분류 영화 목록 -->
        <div class="unranked-container tier-row">
            <div class="tier-label label-unranked" onclick="moveToTier('unranked')" title="클릭하여 선택한 영화를 미분류로 이동">미분류</div>
            <div class="tier-list" id="tier-unranked" ondrop="drop(event, 'unranked')" ondragover="allowDrop(event)"></div>
        </div>
    </main>
</div>

<script>
    // 1. 초기 데이터 설정
    const initialMovies = [
        { id: 'm1', title: '기생충', tier: 'unranked' },
        { id: 'm2', title: '인터스텔라', tier: 'unranked' },
        { id: 'm3', title: '라라랜드', tier: 'unranked' },
        { id: 'm4', title: '센과 치히로의 행방불명', tier: 'unranked' },
        { id: 'm5', title: '어벤져스: 엔드게임', tier: 'unranked' },
        { id: 'm6', title: '범죄도시', tier: 'unranked' },
        { id: 'm7', title: '타이타닉', tier: 'unranked' },
        { id: 'm8', title: '토이 스토리', tier: 'unranked' }
    ];

    let movies = [];
    let selectedMovieId = null; // 클릭으로 이동하기 위해 선택된 영화 ID

    // 2. 데이터 불러오기 및 저장
    function loadMovies() {
        const savedData = localStorage.getItem('myMovieTierList');
        if (savedData) {
            movies = JSON.parse(savedData);
        } else {
            // 깊은 복사로 초기 데이터 할당
            movies = JSON.parse(JSON.stringify(initialMovies));
        }
        render();
    }

    function saveMovies() {
        localStorage.setItem('myMovieTierList', JSON.stringify(movies));
    }

    // 3. 화면 그리기 (렌더링)
    function render() {
        // 모든 리스트 비우기
        const tiers = ['S', 'A', 'B', 'C', 'unranked'];
        tiers.forEach(tier => {
            document.getElementById(`tier-${tier}`).innerHTML = '';
        });

        // 영화 카드를 알맞은 위치에 생성
        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            if (movie.id === selectedMovieId) {
                card.classList.add('selected');
            }
            card.textContent = movie.title;
            card.draggable = true;
            card.id = movie.id;

            // 드래그 앤 드롭 이벤트
            card.addEventListener('dragstart', dragStart);
            card.addEventListener('dragend', dragEnd);

            // 클릭 이벤트 (클릭하여 선택)
            card.addEventListener('click', () => selectMovie(movie.id));

            document.getElementById(`tier-${movie.tier}`).appendChild(card);
        });
    }

    // 4. 영화 추가 기능
    function addMovie() {
        const input = document.getElementById('movie-input');
        const title = input.value.trim();

        if (!title) {
            alert('영화 제목을 입력해 주세요!');
            input.focus();
            return;
        }

        const newMovie = {
            id: 'm' + Date.now(), // 고유 ID 생성
            title: title,
            tier: 'unranked'
        };

        movies.push(newMovie);
        saveMovies();
        render();
        
        input.value = ''; // 입력창 비우기
        input.focus();
    }

    // 엔터키로 추가하기
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addMovie();
        }
    }

    // 5. 초기화 기능
    function resetTierList() {
        if (confirm('정말 처음 상태로 되돌리시겠습니까? 추가한 영화도 모두 삭제됩니다.')) {
            localStorage.removeItem('myMovieTierList');
            selectedMovieId = null;
            loadMovies(); // 초기 데이터로 다시 로드
        }
    }

    // 6. 드래그 앤 드롭 기능
    function dragStart(event) {
        event.dataTransfer.setData('text/plain', event.target.id);
        setTimeout(() => event.target.classList.add('dragging'), 0);
        
        // 드래그 시작 시 클릭 선택 해제
        selectedMovieId = null;
        render();
    }

    function dragEnd(event) {
        event.target.classList.remove('dragging');
    }

    function allowDrop(event) {
        event.preventDefault(); // 드롭을 허용하려면 필수
    }

    function drop(event, targetTier) {
        event.preventDefault();
        const movieId = event.dataTransfer.getData('text/plain');
        updateMovieTier(movieId, targetTier);
    }

    // 7. 클릭으로 이동하는 기능
    function selectMovie(id) {
        // 이미 선택된 영화를 다시 누르면 선택 해제, 아니면 새 영화 선택
        if (selectedMovieId === id) {
            selectedMovieId = null;
        } else {
            selectedMovieId = id;
        }
        render();
    }

    function moveToTier(targetTier) {
        if (selectedMovieId) {
            updateMovieTier(selectedMovieId, targetTier);
            selectedMovieId = null; // 이동 후 선택 해제
            render();
        }
    }

    // 공통: 영화 등급 업데이트 로직
    function updateMovieTier(movieId, newTier) {
        const movieIndex = movies.findIndex(m => m.id === movieId);
        if (movieIndex !== -1) {
            movies[movieIndex].tier = newTier;
            saveMovies();
            render();
        }
    }

    // 8. 앱 시작 시 데이터 불러오기
    window.onload = loadMovies;

</script>
</body>
</html>
