<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 페널티킥 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: white; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none; user-select: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: yellow; font-size: 50px; font-weight: bold;
            display: none; text-shadow: 4px 4px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="ui">점수: <span id="score">0</span> / 시도: <span id="attempts">0</span> (남은 기회: <span id="remains">5</span>)</div>
    <div id="msg">GOAL!</div>

    <!-- 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        // 1. 기본 씬 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 하늘색

        // 2. 카메라 설정 (PerspectiveCamera로 수정)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12); // 공 뒤쪽 위에서 내려다보는 시점
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 3. 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(5, 10, 5);
        scene.add(sunLight);

        // 4. 바닥 (잔디)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 60),
            new THREE.MeshStandardMaterial({ color: 0x2e7d32 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 5. 골대
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const crossbar = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 0.2), postMat);
        crossbar.position.y = 4;
        const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 0.2), postMat);
        leftPost.position.set(-4, 2, 0);
        const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 0.2), postMat);
        rightPost.position.set(4, 2, 0);
        goalGroup.add(crossbar, leftPost, rightPost);
        goalGroup.position.z = -15;
        scene.add(goalGroup);

        // 6. 공
        const ball = new THREE.Mesh(
            new THREE.SphereGeometry(0.4, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        ball.position.set(0, 0.4, 5);
        scene.add(ball);

        // 7. 골키퍼
        const gk = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 2.2, 0.6),
            new THREE.MeshStandardMaterial({ color: 0xd32f2f })
        );
        gk.position.set(0, 1.1, -14.5);
        scene.add(gk);

        // 8. 게임 로직 변수
        let score = 0, attempts = 0, maxAttempts = 5;
        let isKicking = false;
        let startPos = { x: 0, y: 0 };

        // 9. 이벤트 리스너
        window.addEventListener('mousedown', (e) => {
            if (isKicking) return;
            startPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (isKicking) return;
            const endPos = { x: e.clientX, y: e.clientY };
            
            // 드래그 거리와 방향 계산
            const dx = (endPos.x - startPos.x) / window.innerWidth;
            const dy = (startPos.y - endPos.y) / window.innerHeight;

            if (dy > 0.1) { // 위로 드래그했을 때만 발사
                kickBall(dx * 20, dy * 12);
            }
        });

        function kickBall(tx, ty) {
            isKicking = true;
            attempts++;
            updateUI();

            // 골키퍼 랜덤 이동 (-4 ~ 4 사이)
            const gkTargetX = (Math.random() - 0.5) * 8;
            new TWEEN.Tween(gk.position).to({ x: gkTargetX }, 400).start();

            // 공 이동
            new TWEEN.Tween(ball.position)
                .to({ x: tx, y: Math.max(0.4, ty), z: -15 }, 800)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => {
                    checkResult(tx, ty, gkTargetX);
                })
                .start();
        }

        function checkResult(bx, by, gkx) {
            const isInsideGoal = bx > -4 && bx < 4 && by < 4;
            const isBlocked = Math.abs(bx - gkx) < 1.2 && by < 2.5;

            const msgEl = document.getElementById('msg');
            msgEl.style.display = 'block';

            if (isInsideGoal && !isBlocked) {
                score++;
                msgEl.innerText = "GOAL!!";
                msgEl.style.color = "yellow";
            } else if (isBlocked) {
                msgEl.innerText = "SAVED!";
                msgEl.style.color = "orange";
            } else {
                msgEl.innerText = "MISS...";
                msgEl.style.color = "white";
            }

            updateUI();
            setTimeout(resetRound, 1500);
        }

        function resetRound() {
            document.getElementById('msg').style.display = 'none';
            if (attempts >= maxAttempts) {
                alert(`게임 종료! 최종 점수: ${score} / ${maxAttempts}`);
                score = 0; attempts = 0;
                updateUI();
            }
            ball.position.set(0, 0.4, 5);
            gk.position.x = 0;
            isKicking = false;
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('attempts').innerText = attempts;
            document.getElementById('remains').innerText = maxAttempts - attempts;
        }

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 애니메이션 루프
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
