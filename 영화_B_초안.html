<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    margin: 0;
    padding: 20px;
    background: #1e1e2e;
    color: #f0f0f0;
  }
  h1 {
    text-align: center;
    margin: 10px 0 20px;
  }

  .add-box {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 25px;
  }
  .add-box input {
    width: 320px;
    max-width: 60vw;
    padding: 10px 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
  }
  .add-box button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #4c6ef5;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .add-box button:hover { background: #3b5bdb; }

  .tier-row {
    display: flex;
    margin-bottom: 8px;
    border-radius: 6px;
    overflow: hidden;
    min-height: 70px;
  }
  .tier-label {
    flex: 0 0 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    color: #1e1e2e;
  }
  .label-S { background: #ffd43b; }
  .label-A { background: #ff6b6b; }
  .label-B { background: #ffa94d; }
  .label-C { background: #4dabf7; }
  .label-D { background: #adb5bd; }

  .dropzone {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 6px;
    padding: 8px;
    background: #2a2a3c;
    min-height: 70px;
  }
  .dropzone.dragover {
    background: #3a3a52;
    outline: 2px dashed #4c6ef5;
    outline-offset: -4px;
  }

  .card {
    background: #45456a;
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    max-width: 220px;
  }
  .card .title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card.dragging { opacity: 0.4; }
  .card .del {
    cursor: pointer;
    color: #ff8787;
    font-weight: bold;
    line-height: 1;
  }
  .card .del:hover { color: #ff5252; }

  .waiting-wrap { margin-top: 30px; }
  .waiting-wrap h2 {
    font-size: 18px;
    margin-bottom: 8px;
  }
  #waiting {
    background: #2a2a3c;
    border: 1px dashed #555;
    border-radius: 6px;
    min-height: 80px;
  }
</style>
</head>
<body>
  <h1>🎬 나의 영화 티어리스트</h1>

  <div class="add-box">
    <input type="text" id="movieInput" placeholder="영화 제목을 입력하세요" />
    <button id="addBtn">추가</button>
  </div>

  <div id="tiers"></div>

  <div class="waiting-wrap">
    <h2>⌛ 미배치 영화 (대기 공간)</h2>
    <div class="dropzone" id="waiting" data-tier="waiting"></div>
  </div>

<script>
  // ── 설정 ──────────────────────────────────────────────
  const TIERS = ["S", "A", "B", "C", "D"];
  const STORAGE_KEY = "movieTierlistData";

  let data = loadData();

  // ── 티어 영역 초기 생성 ──────────────────────────────
  const tiersEl = document.getElementById("tiers");
  TIERS.forEach(tier => {
    const row = document.createElement("div");
    row.className = "tier-row";
    row.innerHTML = `
      <div class="tier-label label-${tier}">${tier}</div>
      <div class="dropzone" id="zone-${tier}" data-tier="${tier}"></div>
    `;
    tiersEl.appendChild(row);
  });

  // ── 저장 / 불러오기 ──────────────────────────────────
  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { return JSON.parse(saved); } catch (e) {}
    }
    const init = { waiting: [] };
    TIERS.forEach(t => init[t] = []);
    return init;
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ── 렌더링 ───────────────────────────────────────────
  function render() {
    const zones = ["waiting", ...TIERS];
    zones.forEach(key => {
      const zone = (key === "waiting")
        ? document.getElementById("waiting")
        : document.getElementById("zone-" + key);
      zone.innerHTML = "";
      (data[key] || []).forEach(title => {
        zone.appendChild(createCard(title));
      });
    });
    saveData();
  }

  function createCard(title) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.title = title;

    const span = document.createElement("span");
    span.className = "title";
    span.textContent = title;

    const del = document.createElement("span");
    del.className = "del";
    del.textContent = "×";
    del.title = "삭제";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      removeMovie(title);
    });

    card.appendChild(span);
    card.appendChild(del);

    card.addEventListener("dragstart", (e) => {
      draggingTitle = title;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      draggingTitle = null;
      card.classList.remove("dragging");
    });

    return card;
  }

  // ── 추가 / 삭제 ──────────────────────────────────────
  function addMovie(title) {
    title = title.trim();
    if (!title) return;
    data.waiting.push(title);
    render();
  }
  function removeMovie(title) {
    ["waiting", ...TIERS].forEach(key => {
      data[key] = (data[key] || []).filter(t => t !== title);
    });
    render();
  }

  // ── 드래그 앤 드롭 ───────────────────────────────────
  let draggingTitle = null;

  function getInsertBeforeCard(zone, mouseX, mouseY) {
    const cards = [...zone.querySelectorAll(".card:not(.dragging)")];
    for (const card of cards) {
      const rect = card.getBoundingClientRect();
      if (mouseY < rect.bottom && mouseX < rect.left + rect.width / 2) {
        return card;
      }
    }
    return null;
  }

  function setupDropzone(zone) {
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => {
      zone.classList.remove("dragover");
    });
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      if (!draggingTitle) return;

      const targetTier = zone.dataset.tier;
      const beforeCard = getInsertBeforeCard(zone, e.clientX, e.clientY);
      const beforeTitle = beforeCard ? beforeCard.dataset.title : null;

      ["waiting", ...TIERS].forEach(key => {
        data[key] = (data[key] || []).filter(t => t !== draggingTitle);
      });

      const arr = data[targetTier];
      if (beforeTitle === null) {
        arr.push(draggingTitle);
      } else {
        const idx = arr.indexOf(beforeTitle);
        if (idx === -1) arr.push(draggingTitle);
        else arr.splice(idx, 0, draggingTitle);
      }
      render();
    });
  }
  document.querySelectorAll(".dropzone").forEach(setupDropzone);

  // ── 입력 처리 (한글 IME 중복 버그 수정) ──────────────
  const input = document.getElementById("movieInput");

  // 조합 상태 플래그 (compositionstart ~ compositionend 사이)
  let isComposing = false;
  input.addEventListener("compositionstart", () => { isComposing = true; });
  input.addEventListener("compositionend",   () => { isComposing = false; });

  document.getElementById("addBtn").addEventListener("click", () => {
    addMovie(input.value);
    input.value = "";
    input.focus();
  });

  input.addEventListener("keydown", (e) => {
    // ★ 한글 조합 중 Enter → 뒷글자 중복 방지
    if (e.isComposing || isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") {
      addMovie(input.value);
      input.value = "";
    }
  });

  render();
</script>
</body>
</html>
