<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영화 티어리스트</title>
    <style>
        :root {
            --color-s: #FFD700; /* 금색 */
            --color-a: #FF4D4D; /* 빨강 */
            --color-b: #FFA500; /* 주황 */
            --color-c: #4D94FF; /* 파랑 */
            --color-d: #808080; /* 회색 */
            --bg-color: #1a1a1a;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 30px; }

        /* 티어 목록 영역 */
        #tier-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }

        .tier-row {
            display: flex;
            min-height: 90px;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 15px;
            gap: 10px;
            align-content: center;
        }

        /* 티어별 색상 적용 */
        .tier-s .tier-label { background-color: var(--color-s); }
        .tier-a .tier-label { background-color: var(--color-a); }
        .tier-b .tier-label { background-color: var(--color-b); }
        .tier-c .tier-label { background-color: var(--color-c); }
        .tier-d .tier-label { background-color: var(--color-d); }

        /* 영화 카드 스타일 */
        .movie-card {
            background-color: var(--card-bg);
            color: #111;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .movie-card:active { cursor: grabbing; transform: scale(0.95); }

        .delete-btn {
            color: #ff4d4d;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: none;
            font-size: 1.1rem;
            padding: 0;
            line-height: 1;
        }

        /* 입력창 영역 */
        .input-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 1rem;
        }

        input[type="text"]:focus { outline: 2px solid #888; }

        button#add-btn {
            padding: 0 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        /* 미배치 대기 공간 (하단) */
        .unassigned-section {
            width: 100%;
            max-width: 900px;
            background-color: #222;
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 20px;
            min-height: 120px;
        }

        .unassigned-section h3 { margin-top: 0; font-size: 0.9rem; color: #777; text-transform: uppercase; }
        #unassigned-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 80px;
        }

        /* 드래그 중인 상태 표시 */
        .dragging { opacity: 0.4; }
    </style>
</head>
<body>

    <h1>🎬 영화 티어리스트</h1>

    <!-- 티어 목록 -->
    <div id="tier-container">
        <div class="tier-row tier-s" data-tier="S">
            <div class="tier-label">S</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row tier-a" data-tier="A">
            <div class="tier-label">A</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row tier-b" data-tier="B">
            <div class="tier-label">B</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row tier-c" data-tier="C">
            <div class="tier-label">C</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row tier-d" data-tier="D">
            <div class="tier-label">D</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <!-- 영화 추가 입력창 -->
    <div class="input-section">
        <input type="text" id="movie-input" placeholder="영화 제목을 입력하고 Enter를 누르세요..." onkeypress="if(event.keyCode==13) addMovie()">
        <button id="add-btn" onclick="addMovie()">추가</button>
    </div>

    <!-- 미배치 대기 공간 -->
    <div class="unassigned-section">
        <h3>미배치 영화 (대기 공간)</h3>
        <div id="unassigned-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <script>
        // 데이터 저장 객체
        let movieData = {
            S: [], A: [], B: [], C: [], D: [], unassigned: []
        };

        // 페이지 로드 시 로컬스토리지에서 데이터 불러오기
        window.onload = () => {
            const savedData = localStorage.getItem('movieTierData');
            if (savedData) {
                movieData = JSON.parse(savedData);
            }
            render();
        };

        // 로컬스토리지에 데이터 저장
        function saveData() {
            localStorage.setItem('movieTierData', JSON.stringify(movieData));
        }

        // 화면 갱신 함수
        function render() {
            document.querySelectorAll('.tier-content, #unassigned-content').forEach(el => el.innerHTML = '');

            for (const tier in movieData) {
                const container = (tier === 'unassigned') 
                    ? document.getElementById('unassigned-content')
                    : document.querySelector(`.tier-row[data-tier="${tier}"] .tier-content`);
                
                movieData[tier].forEach((title, index) => {
                    const card = createMovieCard(title, tier, index);
                    container.appendChild(card);
                });
            }
        }

        // 영화 카드 생성 함수
        function createMovieCard(title, tier, index) {
            const div = document.createElement('div');
            div.className = 'movie-card';
            div.draggable = true;
            div.innerHTML = `<span>${title}</span>`;
            div.dataset.tier = tier;
            div.dataset.index = index;

            // 삭제 버튼 (확인창 없이 즉시 삭제)
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerText = '✕';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                movieData[tier].splice(index, 1);
                saveData();
                render();
            };

            div.appendChild(delBtn);

            // 드래그 시작 이벤트
            div.ondragstart = (e) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ tier, index }));
                setTimeout(() => div.classList.add('dragging'), 0);
            };
            
            div.ondragend = () => div.classList.remove('dragging');

            return div;
        }

        // 영화 추가 함수
        function addMovie() {
            const input = document.getElementById('movie-input');
            const title = input.value.trim();
            if (title) {
                movieData.unassigned.push(title);
                input.value = '';
                saveData();
                render();
            }
        }

        // 드래그 앤 드롭 허용
        function allowDrop(e) {
            e.preventDefault();
        }

        // 드롭 처리 (이동 및 순서 변경)
        function drop(e) {
            e.preventDefault();
            const dataRaw = e.dataTransfer.getData('text/plain');
            if (!dataRaw) return;
            
            const source = JSON.parse(dataRaw);
            const targetContainer = e.target.closest('.tier-content, #unassigned-content');
            
            if (!targetContainer) return;

            const targetTierName = targetContainer.id === 'unassigned-content' 
                ? 'unassigned' 
                : targetContainer.parentElement.dataset.tier;

            // 기존 위치에서 제거
            const movieTitle = movieData[source.tier].splice(source.index, 1)[0];
            
            // 드롭된 위치(카드 사이) 계산하여 삽입
            const afterElement = getDragAfterElement(targetContainer, e.clientX);
            if (afterElement == null) {
                movieData[targetTierName].push(movieTitle);
            } else {
                const targetIndex = parseInt(afterElement.dataset.index);
                movieData[targetTierName].splice(targetIndex, 0, movieTitle);
            }

            saveData();
            render();
        }

        // 순서 변경을 위한 위치 계산 함수
        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.movie-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>
</body>
</html>
