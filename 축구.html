<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Casual Penalty Kick</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span> / Attempts: <span id="attempts">0</span></div>
    
    <!-- Three.js 및 Tween.js 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        // 1. 기본 설정 (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 하늘색 배경

        const camera = new THREE.Camera();
        camera.position.set(0, 2, 15);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 조명
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 3. 경기장 (잔디)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 40),
            new THREE.MeshStandardMaterial({ color: 0x228B22 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 4. 골대 (단순화된 프레임)
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const crossbar = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 0.2), postMat);
        crossbar.position.y = 3;
        const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 0.2), postMat);
        leftPost.position.set(-4, 1.5, 0);
        const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 0.2), postMat);
        rightPost.position.set(4, 1.5, 0);
        goalGroup.add(crossbar, leftPost, rightPost);
        goalGroup.position.z = -10;
        scene.add(goalGroup);

        // 5. 공
        const ball = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        ball.position.set(0, 0.3, 5);
        scene.add(ball);

        // 6. 골키퍼 (캐주얼 박스 캐릭터)
        const gk = new THREE.Mesh(
            new THREE.BoxGeometry(1, 2, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        gk.position.set(0, 1, -9.5);
        scene.add(gk);

        // 7. 게임 상태 변수
        let score = 0;
        let attempts = 0;
        let isKicking = false;
        let startPos = { x: 0, y: 0 };

        // 8. 마우스/터치 이벤트
        window.addEventListener('mousedown', (e) => {
            if (isKicking) return;
            startPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (isKicking) return;
            const endPos = { x: e.clientX, y: e.clientY };
            const diffX = (endPos.x - startPos.x) / window.innerWidth;
            const diffY = (startPos.y - endPos.y) / window.innerHeight;

            if (diffY > 0.1) kickBall(diffX * 15, diffY * 10);
        });

        // 9. 슛 로직
        function kickBall(targetX, targetY) {
            isKicking = true;
            attempts++;
            document.getElementById('attempts').innerText = attempts;

            // 골키퍼 랜덤 이동 (왼쪽, 오른쪽, 중앙)
            const gkMove = (Math.random() - 0.5) * 8;
            new TWEEN.Tween(gk.position).to({ x: gkMove }, 500).start();

            // 공 이동 (보간)
            new TWEEN.Tween(ball.position)
                .to({ x: targetX, y: Math.max(0.3, targetY), z: -10 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onComplete(() => {
                    checkGoal(targetX, targetY, gkMove);
                    resetBall();
                })
                .start();
        }

        function checkGoal(bx, by, gkx) {
            // 골대 범위 체크 (가로 -4~4, 세로 0~3)
            const isInsideGoal = bx > -4 && bx < 4 && by < 3;
            // 골키퍼 충돌 체크 (단순 거리 비교)
            const isBlocked = Math.abs(bx - gkx) < 1 && by < 2;

            if (isInsideGoal && !isBlocked) {
                score++;
                document.getElementById('score').innerText = score;
                alert("GOAL!");
            } else if (isBlocked) {
                alert("SAVED!");
            } else {
                alert("MISS!");
            }
        }

        function resetBall() {
            ball.position.set(0, 0.3, 5);
            gk.position.x = 0;
            isKicking = false;
            if (attempts >= 5) {
                alert(`Game Over! Final Score: ${score}/5`);
                score = 0; attempts = 0;
                document.getElementById('score').innerText = score;
                document.getElementById('attempts').innerText = attempts;
            }
        }

        // 애니메이션 루프
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
